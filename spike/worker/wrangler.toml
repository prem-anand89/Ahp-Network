# Phase 0.5 spike Worker — bound to the same Hyperdrive config the real app
# uses, so its test routes exercise the actual referral-function logic over
# Hyperdrive rather than a direct Supabase connection.
#
# THROWAWAY, same discipline as the rest of spike/. Phase 0.5 is complete
# (see ../README.md) — this Worker's only reason to exist was proving the
# three PL/pgSQL functions under concurrency, and that's done.
#
# NEVER name this "ahp-network" again. It originally did, deliberately, to
# reuse the real Worker's Hyperdrive binding before Phase 0/1 existed — and
# on 2026-09-04 a `wrangler deploy` run from this directory (while
# troubleshooting an unrelated Cloudflare build failure) silently overwrote
# the live production app with these throwaway test routes, including
# publicly exposing /run-all and /teardown. Renamed here specifically so
# that can't happen again — deploying from this directory now creates or
# updates a separate, harmless Worker instead of clobbering production.
name = "ahp-network-spike-throwaway"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "788ce466573445f9aeac98d779e84774"
