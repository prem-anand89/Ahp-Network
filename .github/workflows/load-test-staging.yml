name: Load test staging

# Phase 12's hard launch gate (plan §7, BUILD_SEQUENCE.md Phase 12): "the
# referral board does not go live to real users until the race-correctness
# tests, the connection-pool load test, and the lapse-vs-accept and
# idempotency tests all pass against staging under real concurrent load."
#
# Calls the already-built /api/internal/load-test route (src/lib/load-test.ts)
# on the deployed staging Worker — this is the one thing no local test
# (including src/db/referral-concurrency.test.ts's real-Postgres suite) can
# substitute for: Hyperdrive's actual connection pooling under real
# concurrent HTTP load hitting a deployed Worker.
#
# Requires the staging Worker's LOAD_TEST_SECRET, which deploy-staging.yml
# now actually provisions via `wrangler secret put` — a prior version of
# this comment claimed that was already true when it wasn't, and the route
# 401ed on every dispatch as a result. Runs from a GitHub-hosted runner
# because this sandbox's own egress policy blocks arbitrary domains.
#
# Each of the four checks below is its own HTTP request/Worker invocation,
# not one `run-all` call — found the hard way: stacking all four sub-tests
# into a single invocation hit Cloudflare's "too many subrequests by single
# Worker invocation" the first time the array-binding bug (fixed in #17/#18)
# stopped masking it. pool-load was already split out for the same reason
# ("a failure here doesn't obscure the others"); splitting the rest the same
# way gives each its own fresh subrequest budget, with no loss of coverage —
# same iteration counts, same real concurrent races, just one request each.

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "Iterations per race/idempotency check"
        default: "8"
      pool_n:
        description: "Concurrent referrals for the pool-load test"
        default: "15"

jobs:
  load-test:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://ahp-network-staging.theranetconnect.workers.dev
      # Staging-only, low blast radius by design (see the route's own doc
      # comment in src/app/api/internal/load-test/route.ts): worst case if
      # ever set on production is fake @loadtest.internal rows, which
      # ?action=teardown removes. Kept as a plain literal shared with
      # deploy-staging.yml's provisioning step rather than a GitHub Actions
      # secret, since this session has no way to create repository secrets —
      # flagged as a follow-up to move behind a real secret when convenient.
      LOAD_TEST_SECRET: "-yfUmWErkjSysJBLeKBFE1pKGaGEjKG8PnrS-PMteks"

    steps:
      - name: accept-race
        run: |
          resp_file=$(mktemp)
          status=$(curl -sS -o "$resp_file" -w '%{http_code}' -L -X POST \
            "$BASE_URL/api/internal/load-test?action=accept-race&iterations=${{ inputs.iterations }}" \
            -H "authorization: Bearer $LOAD_TEST_SECRET")
          echo "HTTP status: $status"
          echo "--- raw response body ---"
          cat "$resp_file"
          echo
          echo "--- end raw response body ---"
          python3 -m json.tool < "$resp_file" || true
          [ "$status" = "200" ]

      - name: shortlist-cap
        if: always()
        run: |
          resp_file=$(mktemp)
          status=$(curl -sS -o "$resp_file" -w '%{http_code}' -L -X POST \
            "$BASE_URL/api/internal/load-test?action=shortlist-cap&iterations=${{ inputs.iterations }}" \
            -H "authorization: Bearer $LOAD_TEST_SECRET")
          echo "HTTP status: $status"
          echo "--- raw response body ---"
          cat "$resp_file"
          echo
          echo "--- end raw response body ---"
          python3 -m json.tool < "$resp_file" || true
          [ "$status" = "200" ]

      - name: lapse-vs-accept
        if: always()
        run: |
          resp_file=$(mktemp)
          status=$(curl -sS -o "$resp_file" -w '%{http_code}' -L -X POST \
            "$BASE_URL/api/internal/load-test?action=lapse-vs-accept&iterations=${{ inputs.iterations }}" \
            -H "authorization: Bearer $LOAD_TEST_SECRET")
          echo "HTTP status: $status"
          echo "--- raw response body ---"
          cat "$resp_file"
          echo
          echo "--- end raw response body ---"
          python3 -m json.tool < "$resp_file" || true
          [ "$status" = "200" ]

      - name: idempotency
        if: always()
        run: |
          resp_file=$(mktemp)
          status=$(curl -sS -o "$resp_file" -w '%{http_code}' -L -X POST \
            "$BASE_URL/api/internal/load-test?action=idempotency&iterations=${{ inputs.iterations }}" \
            -H "authorization: Bearer $LOAD_TEST_SECRET")
          echo "HTTP status: $status"
          echo "--- raw response body ---"
          cat "$resp_file"
          echo
          echo "--- end raw response body ---"
          python3 -m json.tool < "$resp_file" || true
          [ "$status" = "200" ]

      - name: pool-load (run separately so a failure here doesn't obscure the others)
        if: always()
        run: |
          resp_file=$(mktemp)
          status=$(curl -sS -o "$resp_file" -w '%{http_code}' -L -X POST \
            "$BASE_URL/api/internal/load-test?action=pool-load&n=${{ inputs.pool_n }}" \
            -H "authorization: Bearer $LOAD_TEST_SECRET")
          echo "HTTP status: $status"
          echo "--- raw response body ---"
          cat "$resp_file"
          echo
          echo "--- end raw response body ---"
          python3 -m json.tool < "$resp_file" || true
          [ "$status" = "200" ]

      - name: teardown (always — removes every @loadtest.internal row this created)
        if: always()
        run: |
          resp_file=$(mktemp)
          status=$(curl -sS -o "$resp_file" -w '%{http_code}' -L -X POST \
            "$BASE_URL/api/internal/load-test?action=teardown" \
            -H "authorization: Bearer $LOAD_TEST_SECRET")
          echo "HTTP status: $status"
          echo "--- raw response body ---"
          cat "$resp_file"
          echo
          echo "--- end raw response body ---"
          python3 -m json.tool < "$resp_file" || true
          # Previously had no assertion at all — a failed teardown (e.g. the
          # subrequest-limit issue fixed in src/lib/load-test.ts) silently
          # left @loadtest.internal rows in staging with a green job. Every
          # other step here already asserts status; this one now does too.
          [ "$status" = "200" ]
