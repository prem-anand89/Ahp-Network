name: Backup restore test

# Phase 12 — "run a full restore test before this phase is considered
# done." Not a one-time manual check: this runs weekly against the
# actual latest nightly backup, restoring it into a disposable Postgres
# service container that exists only for this job — never against
# production, never against staging. A backup nobody has successfully
# restored is not a backup, it's an unverified assumption; this keeps
# that assumption checked on an ongoing basis, not just proven once.
#
# Depends on the same R2 secrets as nightly-backup.yml (read-only use
# here). Fails (and GitHub notifies) if: no backup exists yet, the
# restore itself errors, or the restored database is missing tables/
# functions the schema expects — any of those means nightly-backup.yml's
# output can't actually be recovered from.

on:
  schedule:
    - cron: "0 21 * * 0" # weekly, Sunday 21:00 UTC — an hour after that night's backup
  workflow_dispatch: {}

jobs:
  restore:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: ahp_network_restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Same version mismatch nightly-backup.yml hit, and the same fix: the
      # bare `pg_dump`/`pg_restore` in $PATH is Debian/Ubuntu's pg_wrapper
      # dispatcher, which kept resolving to a pre-baked v16 on this runner
      # even after postgresql-client-17 was installed — installing the PGDG
      # package alone was not enough. Prepending its real bin directory to
      # $PATH makes the bare `pg_restore` call below resolve to v17 ahead
      # of the wrapper.
      - name: Install postgresql-client-17 (PGDG repo — noble's default is v16)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # Same trailing-newline hazard as nightly-backup.yml: a secret pasted
      # with a trailing newline becomes a literal embedded newline once
      # interpolated into the shell string, which `aws configure set`
      # rejects for aws_secret_access_key. $(...) strips trailing newlines
      # from its output, so routing each secret through printf once here
      # keeps every later step's value clean.
      - name: Read R2 credentials (strip any trailing newline from the secret)
        run: |
          {
            echo "R2_ACCOUNT_ID=$(printf '%s' "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}")"
            echo "R2_ACCESS_KEY_ID=$(printf '%s' "${{ secrets.R2_ACCESS_KEY_ID }}")"
            echo "R2_SECRET_ACCESS_KEY=$(printf '%s' "${{ secrets.R2_SECRET_ACCESS_KEY }}")"
          } >> "$GITHUB_ENV"

      - name: Configure R2 as an S3-compatible endpoint
        run: |
          aws configure set aws_access_key_id "$R2_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$R2_SECRET_ACCESS_KEY"
          aws configure set region auto

      - name: Download the most recent backup
        env:
          R2_ENDPOINT: https://${{ env.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          latest_key=$(aws s3api list-objects-v2 \
            --bucket ahp-network-credentials \
            --prefix "db-backups/ahp_network_" \
            --endpoint-url "$R2_ENDPOINT" \
            --query "sort_by(Contents, &LastModified)[-1].Key" --output text)

          if [ -z "$latest_key" ] || [ "$latest_key" = "None" ]; then
            echo "No backup found under db-backups/ — nightly-backup.yml hasn't produced one yet."
            exit 1
          fi

          echo "Restoring from: $latest_key"
          aws s3 cp "s3://ahp-network-credentials/${latest_key}" backup.dump --endpoint-url "$R2_ENDPOINT"

      # The dump is a full pg_dump of the real Supabase database (see
      # nightly-backup.yml — it stays complete so a real recovery has
      # everything, including auth data public.users has a live FK to).
      # This throwaway container is plain postgres:17, not a Supabase
      # Postgres image: it has none of Supabase's own extensions
      # (supabase_vault, pg_net, pg_graphql, ...), the event triggers wired
      # to them, or the rest of Supabase Auth's own tables (identities,
      # sessions, mfa_*, audit_log_entries, ...) — which bring their own
      # cross-table FKs we have no need to satisfy here. pg_restore's
      # TOC-list filter is the documented way to selectively restore from a
      # custom-format dump: keep the schema this app owns (public,
      # analytics) plus exactly auth.users, since that's the one row public.
      # users.id has a live FK to — drop everything else Supabase-internal.
      - name: Restore the backup
        run: |
          pg_restore --list backup.dump > full.list
          echo "--- DEBUG: raw TOC lines for auth.refresh_tokens/sessions/pg_trgm (temporary) ---"
          grep -iE 'refresh_tokens|auth.*sessions|trgm' full.list | head -30 || true
          echo "--- END DEBUG ---"

          # pg_trgm is ours (drizzle/0000_enable_pg_trgm.sql, backs fuzzy
          # institution/course search) and must survive; only Supabase's own
          # unavailable-outside-Supabase extensions are dropped by name.
          grep -vE 'EXTENSION - "?(supabase_vault|pg_net|pg_graphql|pgjwt|pgsodium|pg_cron)"?([[:space:]]|$)' full.list \
            | grep -vE 'COMMENT.*EXTENSION.*(supabase_vault|pg_net|pg_graphql|pgjwt|pgsodium|pg_cron)' \
            | grep -vE '(^|[[:space:]])EVENT TRIGGER([[:space:]]|$)' \
            | grep -vE '[[:space:]](vault|extensions|graphql_public|graphql|pgbouncer|realtime|supabase_functions|supabase_migrations|net|storage)[[:space:]]' \
            | grep -vE '[[:space:]]auth[[:space:]].*(identities|sessions|refresh_tokens|mfa_factors|mfa_challenges|mfa_amr_claims|sso_providers|sso_domains|saml_providers|saml_relay_states|flow_state|one_time_tokens|audit_log_entries|instances|schema_migrations)' \
            > filtered.list

          pg_restore --no-owner --no-privileges --clean --if-exists \
            --use-list=filtered.list \
            -d "postgres://postgres:localdev@localhost:5432/ahp_network_restore_test" \
            backup.dump

      - name: Verify the restored database is actually usable
        run: |
          PGPASSWORD=localdev psql -h localhost -U postgres -d ahp_network_restore_test -v ON_ERROR_STOP=1 -c "
            DO \$\$
            DECLARE
              table_count INT;
              missing_fn TEXT;
            BEGIN
              SELECT count(*) INTO table_count FROM information_schema.tables WHERE table_schema = 'public';
              IF table_count < 20 THEN
                RAISE EXCEPTION 'Restored database has only % public tables — expected the full schema', table_count;
              END IF;

              SELECT fn INTO missing_fn FROM unnest(ARRAY[
                'shortlist_referral', 'accept_referral', 'lapse_offers',
                'recompute_verification_stage', 'purge_old_audit_logs'
              ]) AS fn
              WHERE fn NOT IN (SELECT proname FROM pg_proc)
              LIMIT 1;
              IF missing_fn IS NOT NULL THEN
                RAISE EXCEPTION 'Restored database is missing function: %', missing_fn;
              END IF;

              RAISE NOTICE 'Restore verified: % public tables, all referral/verification/retention functions present', table_count;
            END
            \$\$;"
