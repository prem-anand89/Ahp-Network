name: Nightly database backup

# Phase 12 — "nightly pg_dump to R2 via GitHub Actions, 30-day rotation."
# Uploads through R2's S3-compatible API via the AWS CLI (never Cloudflare's
# native binding API — CLAUDE.md's non-negotiable applies here too, not
# just to application code) into the existing private ahp-network-
# credentials bucket, under a db-backups/ prefix — reusing that bucket
# rather than provisioning a third one, since backups need exactly the
# same "private, no public access" property credential documents already
# have, and §7's canonical bucket list is deliberately just the two.
#
# One-time setup this workflow depends on (repository secrets):
#   SUPABASE_DB_URL        Direct Postgres connection string for pg_dump —
#                           the session-mode pooler (port 5432), same rule
#                           CLAUDE.md gives Hyperdrive's own origin. This is
#                           a plain dump connection, not Hyperdrive/app
#                           traffic, but the same "never the transaction-
#                           mode pooler" reasoning still avoids surprises.
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / CLOUDFLARE_ACCOUNT_ID
#                           Same R2 API token already used by the app
#                           (src/lib/r2.ts) — read/write access to
#                           ahp-network-credentials is all this needs.
#
# See .github/workflows/restore-test.yml for the automated restore-test
# half of this requirement — it runs against a throwaway Postgres
# container, never against production.

on:
  schedule:
    - cron: "0 20 * * *" # nightly, 20:00 UTC (~1:30am IST, off-peak)
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # Ubuntu noble's own apt repo only carries postgresql-client 16, but
      # Supabase runs Postgres 17 — pg_dump refuses to run against a server
      # newer than itself ("aborting because of server version mismatch").
      # Installing postgresql-client-17 from the PGDG repo turned out not to
      # be sufficient on its own: Debian/Ubuntu's `pg_dump` in $PATH
      # (/usr/bin/pg_dump) is a Perl dispatcher (pg_wrapper) that picks a
      # client version from local cluster config, not simply "the newest
      # one installed" — on this runner it kept resolving to a pre-baked
      # v16 even with v17 installed alongside it. PGDG packages place their
      # real binaries at /usr/lib/postgresql/<version>/bin/, so prepending
      # that directory to $PATH here makes the bare `pg_dump` calls below
      # resolve to v17 directly, ahead of the wrapper.
      - name: Install postgresql-client-17 (PGDG repo — noble's default is v16)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # Secrets pasted through the GitHub UI can carry a trailing newline
      # from the clipboard; interpolated straight into a double-quoted shell
      # string that becomes a literal embedded newline, which `aws configure
      # set` then rejects for aws_secret_access_key ("newline characters and
      # carriage returns are not allowed"). $(...) command substitution
      # strips trailing newlines from its output, so routing each secret
      # through printf inside one lets every later step use a clean value —
      # fixed once here rather than at each call site.
      - name: Read R2 credentials (strip any trailing newline from the secret)
        run: |
          {
            echo "R2_ACCOUNT_ID=$(printf '%s' "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}")"
            echo "R2_ACCESS_KEY_ID=$(printf '%s' "${{ secrets.R2_ACCESS_KEY_ID }}")"
            echo "R2_SECRET_ACCESS_KEY=$(printf '%s' "${{ secrets.R2_SECRET_ACCESS_KEY }}")"
          } >> "$GITHUB_ENV"

      # Supabase-managed schemas (auth, storage, vault, etc.) are provisioned
      # by Supabase itself on any project — including a fresh one stood up
      # during disaster recovery — and their extensions (e.g. supabase_vault)
      # aren't installable outside Supabase's own Postgres images. Dumping
      # them anyway produced a backup that fails to restore anywhere but the
      # exact source project (see restore-test.yml's "supabase_vault is not
      # available" failure). This backup is scoped to what we actually own:
      # public (our schema) and analytics (§8G6's read-only views).
      - name: Dump the database (custom format, pg_dump's own compression)
        run: |
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" --format=custom \
            --exclude-schema=auth --exclude-schema=storage --exclude-schema=vault \
            --exclude-schema=extensions --exclude-schema=graphql --exclude-schema=graphql_public \
            --exclude-schema=pgbouncer --exclude-schema=realtime --exclude-schema=supabase_functions \
            --exclude-schema=supabase_migrations --exclude-schema=net \
            --file=backup.dump

      - name: Configure R2 as an S3-compatible endpoint
        run: |
          aws configure set aws_access_key_id "$R2_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$R2_SECRET_ACCESS_KEY"
          aws configure set region auto

      - name: Upload today's backup
        env:
          R2_ENDPOINT: https://${{ env.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          key="db-backups/ahp_network_$(date -u +%F).dump"
          aws s3 cp backup.dump "s3://ahp-network-credentials/${key}" --endpoint-url "$R2_ENDPOINT"
          echo "Uploaded ${key}"

      - name: Rotate — delete backups older than 30 days
        env:
          R2_ENDPOINT: https://${{ env.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          cutoff=$(date -u -d '30 days ago' +%F)
          aws s3api list-objects-v2 \
            --bucket ahp-network-credentials \
            --prefix "db-backups/ahp_network_" \
            --endpoint-url "$R2_ENDPOINT" \
            --query "Contents[].Key" --output text | tr '\t' '\n' | while read -r key; do
              [ -z "$key" ] && continue
              file_date=$(echo "$key" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
              if [ -n "$file_date" ] && [[ "$file_date" < "$cutoff" ]]; then
                echo "Deleting stale backup: $key (older than $cutoff)"
                aws s3 rm "s3://ahp-network-credentials/${key}" --endpoint-url "$R2_ENDPOINT"
              fi
            done
