name: Weekly digest

# §10H — "This week in your network." Weekly, well outside any timing
# window that would need a tighter cadence, so a plain GitHub Actions
# schedule is fine here in a way it isn't for the referral deadline
# scheduler. Only enqueues into notification_outbox; the existing
# notification-worker cron (every 2 minutes) does the actual sending.
#
# Reuses the same CRON_SECRET already set up for the other two cron
# workflows — no new secret needed.

# SCHEDULE MOVED to Cloudflare Cron Triggers (wrangler.jsonc `triggers.crons`,
# routed by src/lib/cron-routes.ts). GitHub does not guarantee scheduled
# workflows and throttles frequent ones hard — measured on this repo, a
# `*/5` schedule actually fired every 2-4 hours, which left this job's
# heartbeat over an hour stale and broke §8D's sub-hourly requirement.
# Kept dispatch-only so it can still be run by hand for testing or a
# one-off catch-up.
on:
  workflow_dispatch: {}

jobs:
  enqueue:
    runs-on: ubuntu-latest
    steps:
      - name: Enqueue this week's digests
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --fail \
            https://ahp-network.theranetconnect.workers.dev/api/cron/weekly-digest
