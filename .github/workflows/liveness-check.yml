name: Liveness check

# [H2] (Phase 12) — the outbox worker and the deadline scheduler both fail
# *silently*: a dead outbox worker means referrals post fine and nobody is
# ever notified; a dead scheduler means offers never lapse and referrals
# hang in `shortlisted` forever. Neither is visible from the UI, so this
# polls the heartbeat both jobs write on every successful run and fails
# the workflow (triggering GitHub's own failure notification) the moment
# either goes stale or the outbox depth alert fires.
#
# Stays on GitHub Actions on purpose, unlike the jobs it watches (which moved
# to Cloudflare Cron Triggers): a monitor running inside the Worker cannot
# report that Worker being down, and a failed run here is what actually
# notifies the repo owner. Being outside is the whole point.
#
# Cadence: requested every 5 minutes, but GitHub does not honour that —
# measured runs land every 2-4 hours. That is tolerable for an alert channel
# (it delays detection, it does not miss a real outage, since a stale
# heartbeat stays stale) and is not fixable by moving this inside the thing
# it monitors. If detection latency ever needs to be genuinely tight, this
# belongs on an external uptime monitor, not here.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check liveness
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --fail \
            https://ahp-network.theranetconnect.workers.dev/api/cron/liveness-check
