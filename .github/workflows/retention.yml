name: Retention purge

# §8H — automatic, time-based purges (credential documents, referral
# contact fields, stale push subscriptions, practice claim documents,
# contact-reveal metadata, feedback messages, notification payloads, audit
# log rows). Daily is coarse enough for month/day-scale retention windows.
#
# Reuses the same CRON_SECRET already set up for the other cron workflows.

# SCHEDULE MOVED to Cloudflare Cron Triggers (wrangler.jsonc `triggers.crons`,
# routed by src/lib/cron-routes.ts). GitHub does not guarantee scheduled
# workflows and throttles frequent ones hard — measured on this repo, a
# `*/5` schedule actually fired every 2-4 hours, which left this job's
# heartbeat over an hour stale and broke §8D's sub-hourly requirement.
# Kept dispatch-only so it can still be run by hand for testing or a
# one-off catch-up.
on:
  workflow_dispatch: {}

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Run the §8H retention purge
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --fail \
            https://ahp-network.theranetconnect.workers.dev/api/cron/retention
