name: Deploy staging

# Manual staging deploy to ahp-network-staging — separate Worker and
# isolated Supabase project (gkgijnzqphppudpxcifg). Provisions the
# staging Hyperdrive config and auth redirect URLs before deploy.
#
# Required GitHub environment secrets (Settings → Environments → staging):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  (same as production)
#   STAGING_AHP_APP_DB_PASSWORD                  (ahp_app role on staging DB)
#   SUPABASE_ACCESS_TOKEN                        (Management API, for auth URLs)
#
# Optional: STAGING_DATABASE_URL — direct postgres owner URL to run
# drizzle-kit migrate against the real staging DB. If omitted, migrations
# are assumed already applied (e.g. via Supabase MCP during provisioning).

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: ahp_network_staging_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://postgres:localdev@localhost:5432/ahp_network_staging_build
      NEXT_PUBLIC_SUPABASE_URL: https://gkgijnzqphppudpxcifg.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrZ2lqbnpxcGhwcHVkcHhjaWZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MTA0MTAsImV4cCI6MjEwNDE4NjQxMH0.NRGY-0m4RaH9eH0KrFXb1kEPTYNaea4IAqy-oPwQVEQ
      NEXT_PUBLIC_SITE_URL: https://ahp-network-staging.theranetconnect.workers.dev
      STAGING_SUPABASE_PROJECT_REF: gkgijnzqphppudpxcifg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Ensure staging Hyperdrive config
        id: hyperdrive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_AHP_APP_DB_PASSWORD: ${{ secrets.STAGING_AHP_APP_DB_PASSWORD }}
        run: |
          HYPERDRIVE_ID=$(node scripts/ensure-staging-hyperdrive.mjs)
          echo "id=$HYPERDRIVE_ID" >> "$GITHUB_OUTPUT"
          node scripts/patch-wrangler-staging-hyperdrive.mjs "$HYPERDRIVE_ID"

      - name: Configure staging Supabase Auth redirect URLs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/configure-staging-auth.mjs
        continue-on-error: true

      - name: Apply migrations to staging database (optional)
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npx drizzle-kit migrate
        continue-on-error: true

      - name: Stub auth.users for local build Postgres
        run: |
          PGPASSWORD=localdev psql -h localhost -U postgres -d ahp_network_staging_build -c "
            CREATE SCHEMA IF NOT EXISTS auth;
            CREATE TABLE IF NOT EXISTS auth.users (
              id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
              email text
            );"

      - name: Apply migrations (build-time local Postgres)
        env:
          DATABASE_URL: postgres://postgres:localdev@localhost:5432/ahp_network_staging_build
        run: npx drizzle-kit migrate

      - name: Generate route types
        run: npx next typegen

      - name: Build and deploy (staging)
        run: npm run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
